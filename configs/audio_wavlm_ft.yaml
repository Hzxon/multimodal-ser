# PLAN.md model 5 (fine-tune stage): WavLM-base-plus on raw audio, top-4 transformer layers
# unfrozen, CNN frozen, SpecAugment via the HF config, layer weights + head initialised
# from the cached run of the same seed (runs/audio_wavlm_cached/<seed>/best.pt).
name: audio_wavlm_ft
data:
  manifest_dir: data/manifests
  splits: {train: train, dev: dev}
  asr_tag: whisper-small
  text_source: gold
  feature_root: data/processed/features
model:
  type: audio_wavlm
  mode: finetune
  name: microsoft/wavlm-base-plus
  n_layers: 13
  hidden_size: 768
  head_hidden: 256
  dropout: 0.2
  unfreeze_top_n: 4
  normalize_wav: null   # null = follow the HF preprocessor config
  spec_augment: {enabled: true, mask_time_prob: 0.05, mask_time_length: 10}
  # Template: src/train.py replaces {seed} with --seed and re-roots runs/... under --runs-root. A missing run is an error.
  init_from: runs/audio_wavlm_cached/{seed}
train:
  batch_size: 16
  grad_accum: 1
  max_epochs: 15
  patience: 3
  lr_encoder: 2.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_frac: 0.1
  grad_clip: 1.0
  class_weight: sqrt_inv
  undersample: false       # true = PLAN 5 ablation: every class cut to the smallest class count (seeded)
  loss: ce
  max_audio_s: 10
  fp16: true
  augment:
    enabled: true
    speed: {factors: [0.9, 1.1]}
    noise: {snr_db: [10, 30]}
