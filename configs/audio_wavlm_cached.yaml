# PLAN.md model 5 (frozen stage): WavLM-base-plus cached 13-layer mean-pooled states,
# learned softmax layer weights, MLP head. Input cache: <feature_root>/wavlm-base-plus_v1-L13-mean-10s/<split>.npz.
name: audio_wavlm_cached
data:
  manifest_dir: data/manifests
  splits: {train: train, dev: dev}
  asr_tag: whisper-small
  text_source: gold
  feature_root: data/processed/features
  caches:
    wavlm: {extractor: wavlm-base-plus, version: v1-L13-mean-10s}
model:
  type: audio_wavlm
  mode: cached
  name: microsoft/wavlm-base-plus
  n_layers: 13
  hidden_size: 768
  head_hidden: 256
  dropout: 0.2
train:
  batch_size: 16
  grad_accum: 1
  max_epochs: 15
  patience: 3
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_frac: 0.1
  grad_clip: 1.0
  class_weight: sqrt_inv
  undersample: false       # true = PLAN 5 ablation: every class cut to the smallest class count (seeded)
  loss: ce
  max_audio_s: 10
  fp16: true
  augment: {enabled: false}   # cached features are fixed; augmentation applies to the finetune stage
